<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Adventure Logo</title>

<style>
html,body{
margin:0;
overflow:hidden;
background:black;
font-family:Impact, Arial Black, sans-serif;
}

canvas{
position:absolute;
top:0;
left:0;
}

#logo{
position:absolute;
top:50%;
left:50%;
transform:translate(-50%,-50%);
white-space:nowrap;
font-weight:900;
font-size:8vw;
letter-spacing:0.15em;
perspective:800px;
}

.letter{
display:inline-block;
opacity:0;
transform:translateZ(-200px) scale(0.2) rotateX(-60deg);
transition:transform .6s cubic-bezier(.25,1.5,.5,1),opacity .4s;
}

.face{
background:linear-gradient(180deg,#ffe600,#ff9900,#ff4500);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.outline{
position:absolute;
left:0;
top:0;
color:black;
z-index:-1;
transform:translateZ(-6px) scale(1.08);
text-shadow:
3px 3px 0 #000,
-3px 3px 0 #000,
3px -3px 0 #000,
-3px -3px 0 #000,
6px 6px 10px rgba(0,0,0,.8);
}

.jump{
transform:translateZ(120px) scale(1.2) rotateX(0deg);
opacity:1;
}

.idle{
animation:float 3s ease-in-out infinite alternate;
}

@keyframes float{
0%{transform:translateY(0)}
100%{transform:translateY(-6px)}
}
</style>
</head>

<body>

<canvas id="stars"></canvas>
<div id="logo"></div>

<script>

const TITLE="SPACE SLUGGERS";

const container=document.getElementById("logo");

function createLogo(){

container.innerHTML="";

TITLE.split("").forEach((char,i)=>{

const wrap=document.createElement("span");
wrap.className="letter";

const face=document.createElement("span");
face.className="face";
face.textContent=char;

const outline=document.createElement("span");
outline.className="outline";
outline.textContent=char;

wrap.appendChild(outline);
wrap.appendChild(face);

container.appendChild(wrap);

setTimeout(()=>{
wrap.classList.add("jump");

setTimeout(()=>{
wrap.classList.add("idle");
},600);

},i*90);

});

}

createLogo();

document.addEventListener("keydown",e=>{
if(e.key==="r"||e.key==="R")createLogo();
});



/* STARFIELD */

const canvas=document.getElementById("stars");
const ctx=canvas.getContext("2d");

let w,h;

function resize(){
w=canvas.width=window.innerWidth;
h=canvas.height=window.innerHeight;
}

window.onresize=resize;
resize();

const stars=[];
const STAR_COUNT=250;

for(let i=0;i<STAR_COUNT;i++){

stars.push({
x:Math.random()*w,
y:Math.random()*h,
z:Math.random()*2,
s:Math.random()*2
});

}

function draw(){

ctx.fillStyle="black";
ctx.fillRect(0,0,w,h);

ctx.fillStyle="white";

stars.forEach(star=>{

star.y+=star.z;

if(star.y>h){
star.y=0;
star.x=Math.random()*w;
}

ctx.globalAlpha=0.3+star.z;

ctx.fillRect(star.x,star.y,star.s,star.s);

});

requestAnimationFrame(draw);

}

draw();

</script>

</body>
</html>
