<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Logo Test</title>
  <style>
    html, body { margin:0; padding:0; overflow:hidden; background:#000; }
    canvas { display:block; }

    /* Simple debug overlay so it's NEVER "blank" without explanation */
    #hud{
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      color:#fff;
      font:600 14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:radial-gradient(ellipse at center, rgba(25,25,25,.65), rgba(0,0,0,.92));
      z-index:10;
      padding:24px;
      text-align:center;
    }
    #hud pre{
      margin:12px auto 0;
      max-width:920px;
      white-space:pre-wrap;
      word-break:break-word;
      opacity:.9;
      font-weight:500;
    }
    #hint{opacity:.8; margin-top:10px; font-weight:500}
  </style>
</head>
<body>
  <div id="hud">
    <div>
      Loading 3D logo…
      <div id="hint">If this hangs, I’ll show the exact error here.</div>
      <pre id="err"></pre>
    </div>
  </div>

  <!-- Use “classic” (non-module) Three.js + classic examples. Works well on iOS Safari + GitHub Pages -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>

  <script>
    // ---- Error reporting (so you never stare at blank) ----
    const hud = document.getElementById('hud');
    const errBox = document.getElementById('err');

    function showErr(msg){
      errBox.textContent = (errBox.textContent ? (errBox.textContent + "\n\n") : "") + String(msg);
    }

    window.addEventListener('error', (e) => {
      showErr("JS Error: " + (e.message || e.error || e));
    });

    window.addEventListener('unhandledrejection', (e) => {
      showErr("Promise rejection: " + (e.reason && (e.reason.stack || e.reason.message) || e.reason || e));
    });

    // =========================
    // EDIT ME
    // =========================
    const TITLE = "SPACE SLUGGERS";   // <- change this
    // =========================

    // ---- Guard: Three loaded? ----
    if(!window.THREE){
      showErr("THREE failed to load from CDN. (Content blocker / network / CDN blocked).");
      throw new Error("THREE missing");
    }

    // ---- Scene ----
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 2000);
    camera.position.set(0, 0, 52);

    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    document.body.appendChild(renderer.domElement);

    addEventListener("resize", () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));
    const key = new THREE.DirectionalLight(0xffffff, 1.2);
    key.position.set(6, 10, 12);
    scene.add(key);
    const rim = new THREE.DirectionalLight(0xffcc33, 1.1);
    rim.position.set(-10, -3, 10);
    scene.add(rim);

    // Stars
    const starCount = 1800;
    const starGeom = new THREE.BufferGeometry();
    const pos = new Float32Array(starCount*3);
    for(let i=0;i<starCount;i++){
      pos[i*3+0] = (Math.random()-0.5)*520;
      pos[i*3+1] = (Math.random()-0.5)*360;
      pos[i*3+2] = -Math.random()*1200;
    }
    starGeom.setAttribute("position", new THREE.BufferAttribute(pos,3));
    const stars = new THREE.Points(
      starGeom,
      new THREE.PointsMaterial({ color:0xffffff, size:0.9 })
    );
    scene.add(stars);

    // Text group
    const group = new THREE.Group();
    group.rotation.x = -0.20;
    group.rotation.y = 0.15;
    scene.add(group);

    const letters = [];
    let introT = 0;
    const clock = new THREE.Clock();

    function replay(){
      introT = 0;
      for(const L of letters){
        L.obj.position.z = -110;
        L.obj.rotation.x = -0.9;
        L.obj.scale.set(1,1,1);
      }
      camera.position.z = 52;
    }

    addEventListener("keydown", (e) => {
      if(e.key === "r" || e.key === "R") replay();
    });

    // ---- Load font from SAME CDN family to reduce weird cross-origin issues ----
    // (This URL is a raw font JSON used in three examples)
    const fontUrl = "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json";

    const loader = new THREE.FontLoader();
    loader.load(
      fontUrl,
      (font) => {
        // Build 3D letters
        const chars = TITLE.split("");
        let x = 0;
        const spacing = 5.2;

        for(let i=0;i<chars.length;i++){
          const ch = chars[i];
          if(ch === " "){ x += spacing*0.7; continue; }

          const geo = new THREE.TextGeometry(ch, {
            font,
            size: 5,
            height: 1.6,
            curveSegments: 6,
            bevelEnabled: true,
            bevelThickness: 0.28,
            bevelSize: 0.25,
            bevelSegments: 3
          });
          geo.center();

          // Main “fire” look (simple, strong)
          const mainMat = new THREE.MeshStandardMaterial({
            color: 0xff7a00,
            metalness: 0.55,
            roughness: 0.25
          });
          const main = new THREE.Mesh(geo, mainMat);

          // Thick outline (classic logo feel): back-side expanded mesh
          const outlineMat = new THREE.MeshStandardMaterial({
            color: 0x050505,
            metalness: 0.05,
            roughness: 0.95,
            side: THREE.BackSide
          });
          const outline = new THREE.Mesh(geo, outlineMat);
          outline.scale.set(1.12, 1.12, 1.12);
          outline.position.z = -0.38;

          const letter = new THREE.Group();
          letter.add(outline);
          letter.add(main);

          letter.position.set(x, 0, -110);
          letter.rotation.x = -0.9;

          group.add(letter);
          letters.push({ obj: letter, delay: i*0.11 });

          x += spacing;
        }

        group.position.x = -x/2 + spacing*0.3;

        // Hide loading overlay now that font + meshes exist
        hud.style.display = "none";

        // Start animation loop (only after success)
        tick();
      },
      undefined,
      (err) => {
        showErr("Font failed to load: " + (err && (err.message || err.toString()) || err));
      }
    );

    function tick(){
      requestAnimationFrame(tick);

      const dt = clock.getDelta();
      introT += dt;

      // Stars fly toward camera
      const a = starGeom.attributes.position.array;
      for(let i=0;i<a.length;i+=3){
        a[i+2] += 6.0;
        if(a[i+2] > 40) a[i+2] = -1200;
      }
      starGeom.attributes.position.needsUpdate = true;

      // Letter stagger punch-in + settle + idle float
      for(let i=0;i<letters.length;i++){
        const L = letters[i];
        const t = introT - L.delay;

        if(t > 0){
          const p = Math.min(t*2.2, 1);
          L.obj.position.z = THREE.MathUtils.lerp(-110, 0, p);
          L.obj.rotation.x = THREE.MathUtils.lerp(-0.9, 0, p);

          // micro “impact” scale punch
          const punch = (t < 0.35) ? (1 + Math.sin(t*18)*0.06) : 1;
          L.obj.scale.set(punch, punch, punch);
        }

        if(t > 1.0){
          L.obj.position.y = Math.sin((introT + i*0.11)*2.3) * 0.35;
        }
      }

      // Camera punch-in
      camera.position.z = 52 - Math.min(introT*10.5, 14);

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
