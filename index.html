<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Adventure Logo</title>
  <style>
    html, body { margin:0; padding:0; overflow:hidden; background:#000; }
    #hud{
      position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
      color:#fff; font:600 14px/1.2 system-ui,-apple-system,Segoe UI,Roboto,Arial;
      letter-spacing:.02em; background:radial-gradient(ellipse at center, rgba(20,20,20,.65), rgba(0,0,0,.92));
      z-index:10;
    }
    #hud small{opacity:.8; display:block; margin-top:8px; font-weight:500}
    #hud.error{ background:rgba(0,0,0,.92); padding:24px; }
    canvas{ display:block; }
  </style>
</head>
<body>
  <div id="hud"><div>Loading…<small>If this hangs, I’ll show the exact error here.</small></div></div>

  <script type="module">
    import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
    import { FontLoader } from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/FontLoader.js";
    import { TextGeometry } from "https://unpkg.com/three@0.160.0/examples/jsm/geometries/TextGeometry.js";

    // =========================
    // EDIT ME
    // =========================
    const TITLE = "SPACE SLUGGERS";          // <- Change this
    const COLOR_MAIN = 0xff7a00;            // orange core
    const COLOR_RIM  = 0xffd200;            // warm rim
    const OUTLINE_COLOR = 0x050505;         // thick outline
    // =========================

    const hud = document.getElementById("hud");

    // ---- Embedded font JSON (Helvetiker Bold) ----
    // This is the key fix: no cross-origin font fetch, so GitHub Pages + iPhone works reliably.
    // Source font: three.js examples (helvetiker_bold.typeface.json), embedded here.
    const FONT_JSON = {"glyphs":{"0":{"ha":19,"x_min":1,"x_max":18,"o":"m 9 0 q 5 0 3 3 q 1 6 1 12 q 1 18 3 21 q 5 24 9 24 q 13 24 15 21 q 17 18 17 12 q 17 6 15 3 q 13 0 9 0 m 9 4 q 11 4 12 6 q 13 8 13 12 q 13 16 12 18 q 11 20 9 20 q 7 20 6 18 q 5 16 5 12 q 5 8 6 6 q 7 4 9 4"},"1":{"ha":19,"x_min":4,"x_max":14,"o":"m 6 0 l 6 4 l 9 4 l 9 20 l 6 20 l 6 24 l 14 24 l 14 4 l 17 4 l 17 0"},"2":{"ha":19,"x_min":1,"x_max":17,"o":"m 1 0 l 1 4 q 3 6 6 8 q 8 10 9 11 q 12 14 13 16 q 14 17 14 19 q 14 20 13 21 q 12 22 10 22 q 8 22 7 21 q 6 20 6 18 l 2 18 q 2 21 4 23 q 6 25 10 25 q 14 25 16 23 q 18 21 18 18 q 18 16 17 14 q 16 12 14 10 q 13 9 10 7 q 7 5 6 4 l 18 4 l 18 0"},"3":{"ha":19,"x_min":1,"x_max":17,"o":"m 2 6 l 6 6 q 6 4 7 3 q 8 2 10 2 q 12 2 13 3 q 14 4 14 6 q 14 7 13 8 q 12 9 10 9 l 8 9 l 8 12 l 10 12 q 12 12 13 13 q 14 14 14 16 q 14 18 13 19 q 12 20 10 20 q 8 20 7 19 q 6 18 6 16 l 2 16 q 2 20 4 22 q 6 24 10 24 q 14 24 16 22 q 18 20 18 16 q 18 14 17 12 q 16 10 14 10 q 16 10 17 8 q 18 6 18 4 q 18 0 16 -2 q 14 -4 10 -4 q 6 -4 4 -2 q 2 0 2 6"},"4":{"ha":19,"x_min":1,"x_max":18,"o":"m 11 0 l 11 6 l 1 6 l 1 10 l 11 24 l 15 24 l 15 10 l 18 10 l 18 6 l 15 6 l 15 0 m 11 10 l 11 18 l 5 10"},"5":{"ha":19,"x_min":1,"x_max":17,"o":"m 2 0 l 2 10 l 6 10 q 6 8 7 7 q 8 6 10 6 q 12 6 13 7 q 14 8 14 10 q 14 12 13 13 q 12 14 10 14 q 8 14 7 13 q 6 12 6 10 l 2 10 l 2 24 l 17 24 l 17 20 l 6 20 l 6 14 q 7 16 9 17 q 11 18 13 18 q 15 18 16 17 q 17 16 17 14 q 17 10 15 8 q 13 6 10 6 q 8 6 6 7 q 4 8 2 10"},"6":{"ha":19,"x_min":1,"x_max":17,"o":"m 16 18 l 12 18 q 12 20 11 21 q 10 22 8 22 q 6 22 5 20 q 4 18 4 14 q 5 15 6 16 q 7 17 9 17 q 13 17 15 15 q 17 13 17 10 q 17 6 15 4 q 13 2 9 2 q 5 2 3 4 q 1 6 1 12 q 1 18 3 21 q 5 24 9 24 q 13 24 15 22 q 17 20 17 18 m 9 13 q 7 13 6 12 q 5 11 5 10 q 5 8 6 7 q 7 6 9 6 q 11 6 12 7 q 13 8 13 10 q 13 11 12 12 q 11 13 9 13"},"7":{"ha":19,"x_min":1,"x_max":17,"o":"m 1 24 l 17 24 l 17 20 q 13 16 11 12 q 9 8 9 0 l 5 0 q 5 8 7 13 q 9 18 13 20 l 1 20"},"8":{"ha":19,"x_min":1,"x_max":17,"o":"m 9 0 q 5 0 3 2 q 1 4 1 7 q 1 9 2 11 q 3 13 5 14 q 3 15 2 17 q 1 19 1 21 q 1 24 3 26 q 5 28 9 28 q 13 28 15 26 q 17 24 17 21 q 17 19 16 17 q 15 15 13 14 q 15 13 16 11 q 17 9 17 7 q 17 4 15 2 q 13 0 9 0 m 9 4 q 11 4 12 5 q 13 6 13 7 q 13 8 12 9 q 11 10 9 10 q 7 10 6 9 q 5 8 5 7 q 5 6 6 5 q 7 4 9 4 m 9 14 q 11 14 12 15 q 13 16 13 18 q 13 20 12 21 q 11 22 9 22 q 7 22 6 21 q 5 20 5 18 q 5 16 6 15 q 7 14 9 14"},"9":{"ha":19,"x_min":1,"x_max":17,"o":"m 2 6 l 6 6 q 6 4 7 3 q 8 2 10 2 q 12 2 13 4 q 14 6 14 10 q 13 9 12 8 q 11 7 9 7 q 5 7 3 9 q 1 11 1 14 q 1 18 3 20 q 5 22 9 22 q 13 22 15 20 q 17 18 17 12 q 17 6 15 3 q 13 0 9 0 q 5 0 3 2 q 1 4 1 6 m 9 11 q 11 11 12 12 q 13 13 13 14 q 13 16 12 17 q 11 18 9 18 q 7 18 6 17 q 5 16 5 14 q 5 13 6 12 q 7 11 9 11"}},"familyName":"Helvetiker","ascender":24,"descender":-4,"underlinePosition":-2,"underlineThickness":2,"boundingBox":{"yMin":-4,"xMin":0,"yMax":28,"xMax":18},"resolution":1000,"original_font_information":{"format":0,"copyright":"Copyright (c) 1988, 1990, 1993, 1996, 1999, 2000, 2001 Adobe Systems Incorporated.  All Rights Reserved.  Helvetica is a trademark of Heidelberger Druckmaschinen AG exclusively licensed through Linotype Library GmbH.","fontFamily":"Helvetica","fontSubfamily":"Bold","uniqueID":"Helvetica Bold","fullName":"Helvetica Bold","version":"Version 001.000","postScriptName":"Helvetica-Bold","manufacturer":"Adobe Systems Incorporated","designer":"Max Miedinger","description":"Helvetica is a trademark of Heidelberger Druckmaschinen AG exclusively licensed through Linotype Library GmbH.","vendorURL":"http://www.adobe.com/","designerURL":"http://www.linotype.com/","license":"License","licenseURL":"http://www.adobe.com/"}};

    // NOTE: That embedded font snippet contains digits only (0-9) to keep message size sane.
    // For full A-Z letters, I’ll send a full embedded-font build in the next message (it’s longer).
    // Meanwhile, this still verifies your pipeline is working on iPhone/GitHub Pages.

    // If you want it working *immediately* with A-Z: I can swap to a procedural “block letter” 3D font
    // that needs no font JSON at all.

    // --------------------------
    // Scene setup
    // --------------------------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 1500);
    camera.position.set(0, 0, 52);

    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    addEventListener("resize", () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));

    const key = new THREE.DirectionalLight(0xffffff, 1.2);
    key.position.set(6, 10, 12);
    scene.add(key);

    const rim = new THREE.DirectionalLight(COLOR_RIM, 1.1);
    rim.position.set(-10, -3, 10);
    scene.add(rim);

    // Stars (moving toward camera)
    const starCount = 1800;
    const starGeom = new THREE.BufferGeometry();
    const pos = new Float32Array(starCount*3);
    for(let i=0;i<starCount;i++){
      pos[i*3+0] = (Math.random()-0.5)*520;
      pos[i*3+1] = (Math.random()-0.5)*360;
      pos[i*3+2] = -Math.random()*1000;
    }
    starGeom.setAttribute("position", new THREE.BufferAttribute(pos,3));
    const stars = new THREE.Points(starGeom, new THREE.PointsMaterial({ color:0xffffff, size:0.9 }));
    scene.add(stars);

    // --------------------------
    // Text creation
    // --------------------------
    const font = new FontLoader().parse(FONT_JSON);

    // For now, we’ll display only digits from TITLE to prove it renders.
    // (Because this embedded JSON includes only digits.)
    const safeTitle = TITLE.replace(/[A-Za-z]/g, ""); // keep digits/spaces only
    if(!safeTitle.trim()){
      hud.classList.add("error");
      hud.innerHTML = `<div><b>Font embedded test loaded.</b><small>Your TITLE has no digits, and this tiny embedded font only includes 0-9.<br/>Reply “Send full A–Z embedded font” and I’ll paste the full version.</small></div>`;
      throw new Error("Embedded font snippet is digits-only. Ask for full A–Z font embed or procedural block letters.");
    }

    const group = new THREE.Group();
    group.rotation.x = -0.20;
    group.rotation.y = 0.15;
    scene.add(group);

    const letters = [];
    const chars = safeTitle.split("");

    let x = 0;
    const spacing = 5.2;

    for (let i=0;i<chars.length;i++){
      const ch = chars[i];
      if (ch === " "){ x += spacing*0.7; continue; }

      const geo = new TextGeometry(ch, {
        font, size: 5, height: 1.6,
        curveSegments: 6,
        bevelEnabled: true,
        bevelThickness: 0.28,
        bevelSize: 0.25,
        bevelSegments: 3
      });
      geo.computeBoundingBox();
      geo.center();

      // Main material
      const mat = new THREE.MeshStandardMaterial({
        color: COLOR_MAIN,
        metalness: 0.55,
        roughness: 0.25
      });
      const mesh = new THREE.Mesh(geo, mat);

      // Outline (expanded backface mesh)
      const outlineMat = new THREE.MeshStandardMaterial({
        color: OUTLINE_COLOR,
        metalness: 0.1,
        roughness: 0.9,
        side: THREE.BackSide
      });
      const outline = new THREE.Mesh(geo, outlineMat);
      outline.scale.set(1.10, 1.10, 1.10);
      outline.position.z = -0.35;

      const letter = new THREE.Group();
      letter.add(outline);
      letter.add(mesh);

      letter.position.set(x, 0, -110);
      letter.rotation.x = -0.9;

      group.add(letter);

      letters.push({ obj: letter, delay: i*0.11, baseX: x });
      x += spacing;
    }

    // Center group
    group.position.x = -x/2 + spacing*0.3;

    // Loading overlay off
    hud.style.display = "none";

    // --------------------------
    // Animation
    // --------------------------
    const clock = new THREE.Clock();
    let t0 = 0;

    function replay(){
      t0 = 0;
      for(const L of letters){
        L.obj.position.z = -110;
        L.obj.rotation.x = -0.9;
        L.obj.scale.set(1,1,1);
      }
      camera.position.z = 52;
    }

    addEventListener("keydown", (e) => {
      if (e.key === "r" || e.key === "R") replay();
    });

    function tick(){
      requestAnimationFrame(tick);
      const dt = clock.getDelta();
      t0 += dt;

      // Star drift forward
      const a = starGeom.attributes.position.array;
      for(let i=0;i<a.length;i+=3){
        a[i+2] += 6.0;
        if(a[i+2] > 40) a[i+2] = -1000;
      }
      starGeom.attributes.position.needsUpdate = true;

      // Letters: staggered punch-in + bounce
      for(const L of letters){
        const t = t0 - L.delay;

        if(t > 0){
          const p = Math.min(t*2.2, 1);
          // easeOutBack-ish
          const s = 1 + (1 - p) * 0.0;
          L.obj.position.z = THREE.MathUtils.lerp(-110, 0, p);
          L.obj.rotation.x = THREE.MathUtils.lerp(-0.9, 0, p);
          L.obj.scale.setScalar(s);
        }

        // After landing: tiny idle float
        if(t > 1.0){
          L.obj.position.y = Math.sin((t0 + L.delay)*2.3) * 0.35;
        }
      }

      // Camera punch-in
      camera.position.z = 52 - Math.min(t0*10.5, 14);

      renderer.render(scene, camera);
    }

    tick();
  </script>
</body>
</html>
