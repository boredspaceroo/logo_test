<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Logo Test</title>
  <style>
    html, body { margin:0; padding:0; overflow:hidden; background:#000; }
    canvas { display:block; }

    /* Debug overlay: you'll never get a silent blank page */
    #hud{
      position:fixed; inset:0;
      display:flex; align-items:center; justify-content:center;
      color:#fff;
      font:600 14px/1.35 system-ui,-apple-system,Segoe UI,Roboto,Arial;
      background:radial-gradient(ellipse at center, rgba(25,25,25,.65), rgba(0,0,0,.92));
      z-index:10;
      padding:24px;
      text-align:center;
    }
    #hud pre{
      margin:12px auto 0;
      max-width:920px;
      white-space:pre-wrap;
      word-break:break-word;
      opacity:.9;
      font-weight:500;
    }
    #hint{opacity:.8; margin-top:10px; font-weight:500}
  </style>
</head>
<body>
  <div id="hud">
    <div>
      Loading 3D logo…
      <div id="hint">If this hangs, I’ll show the exact error here.</div>
      <pre id="err"></pre>
    </div>
  </div>

  <!-- Classic (non-module) Three.js + classic examples: stable on iOS Safari + GitHub Pages -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FontLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/geometries/TextGeometry.js"></script>

  <script>
    // --------------------------
    // Error reporting
    // --------------------------
    const hud = document.getElementById('hud');
    const errBox = document.getElementById('err');

    function showErr(msg){
      errBox.textContent = (errBox.textContent ? (errBox.textContent + "\n\n") : "") + String(msg);
    }
    window.addEventListener('error', (e) => showErr("JS Error: " + (e.message || e.error || e)));
    window.addEventListener('unhandledrejection', (e) => showErr("Promise rejection: " + (e.reason && (e.reason.stack || e.reason.message) || e.reason || e)));

    // =========================
    // EDIT ME
    // =========================
    const TITLE = "SPACE SLUGGERS"; // <- change this
    // Gradient face colors (top -> mid -> bottom)
    const GRAD_TOP = new THREE.Color(0xfff3a0);
    const GRAD_MID = new THREE.Color(0xffb400);
    const GRAD_BOT = new THREE.Color(0xff3b00);

    const OUTLINE_COLOR = 0x050505;
    const GLOW_COLOR    = 0xff7a00;

    // Motion tuning
    const CAMERA_Z_START = 52;
    const PUNCH_LANDSCAPE = 14;   // max camera push in landscape
    const PUNCH_PORTRAIT   = 9.5; // gentler in portrait to avoid cropping
    // =========================

    if(!window.THREE){
      showErr("THREE failed to load from CDN. (Content blocker / network / CDN blocked).");
      throw new Error("THREE missing");
    }

    // --------------------------
    // Scene
    // --------------------------
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 2500);
    camera.position.set(0, 0, CAMERA_Z_START);

    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
    document.body.appendChild(renderer.domElement);

    addEventListener("resize", () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      // re-fit group on resize once built
      if (logoGroup) applyResponsiveFit();
    });

    // Lights
    scene.add(new THREE.AmbientLight(0xffffff, 0.55));

    const key = new THREE.DirectionalLight(0xffffff, 1.25);
    key.position.set(6, 10, 12);
    scene.add(key);

    const rim = new THREE.DirectionalLight(0xffcc33, 1.15);
    rim.position.set(-10, -3, 10);
    scene.add(rim);

    // --------------------------
    // Stars
    // --------------------------
    const starCount = 1900;
    const starGeom = new THREE.BufferGeometry();
    const starPos = new Float32Array(starCount*3);
    for(let i=0;i<starCount;i++){
      starPos[i*3+0] = (Math.random()-0.5)*520;
      starPos[i*3+1] = (Math.random()-0.5)*360;
      starPos[i*3+2] = -Math.random()*1300;
    }
    starGeom.setAttribute("position", new THREE.BufferAttribute(starPos,3));

    const stars = new THREE.Points(
      starGeom,
      new THREE.PointsMaterial({ color:0xffffff, size:0.9 })
    );
    scene.add(stars);

    // --------------------------
    // Gradient face material (keeps MeshStandard lighting, adds gradient tint)
    // --------------------------
    function makeGradientStandardMaterial(minY, maxY){
      const mat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        metalness: 0.58,
        roughness: 0.22
      });

      mat.onBeforeCompile = (shader) => {
        shader.uniforms.uMinY = { value: minY };
        shader.uniforms.uMaxY = { value: maxY };
        shader.uniforms.uTop  = { value: GRAD_TOP.clone() };
        shader.uniforms.uMid  = { value: GRAD_MID.clone() };
        shader.uniforms.uBot  = { value: GRAD_BOT.clone() };

        shader.vertexShader = shader.vertexShader
          .replace(
            "#include <common>",
            "#include <common>\nvarying float vLocalY;\n"
          )
          .replace(
            "#include <begin_vertex>",
            "#include <begin_vertex>\nvLocalY = position.y;\n"
          );

        shader.fragmentShader = shader.fragmentShader
          .replace(
            "#include <common>",
            "#include <common>\nvarying float vLocalY;\nuniform float uMinY;\nuniform float uMaxY;\nuniform vec3 uTop;\nuniform vec3 uMid;\nuniform vec3 uBot;\n"
          )
          .replace(
            "vec4 diffuseColor = vec4( diffuse, opacity );",
            `
            vec4 diffuseColor = vec4( diffuse, opacity );
            float t = clamp((vLocalY - uMinY) / max(0.0001, (uMaxY - uMinY)), 0.0, 1.0);
            vec3 grad = mix(uBot, uMid, smoothstep(0.0, 0.55, t));
            grad = mix(grad, uTop, smoothstep(0.55, 1.0, t));
            diffuseColor.rgb *= grad;
            `
          );

        mat.userData.shader = shader;
      };

      return mat;
    }

    // --------------------------
    // Logo construction
    // --------------------------
    let logoGroup = null;
    const letters = [];
    let introT = 0;
    const clock = new THREE.Clock();

    // Spark bursts
    const bursts = [];

    function spawnSparkBurst(worldPos){
      // lightweight, no textures: additive points that fly out and fade
      const count = 34;
      const geom = new THREE.BufferGeometry();
      const pos = new Float32Array(count*3);
      const vel = new Float32Array(count*3);

      for(let i=0;i<count;i++){
        pos[i*3+0] = worldPos.x;
        pos[i*3+1] = worldPos.y;
        pos[i*3+2] = worldPos.z;

        // outward cone-ish, slightly forward
        const angle = Math.random() * Math.PI * 2;
        const r = 0.6 + Math.random() * 1.2;
        const up = (Math.random() - 0.2) * 1.6;

        vel[i*3+0] = Math.cos(angle) * r;
        vel[i*3+1] = up;
        vel[i*3+2] = (Math.random()*0.9) - 0.2;
      }

      geom.setAttribute("position", new THREE.BufferAttribute(pos, 3));

      const mat = new THREE.PointsMaterial({
        color: 0xffc24a,
        size: 1.05,
        transparent: true,
        opacity: 0.95,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const pts = new THREE.Points(geom, mat);
      scene.add(pts);

      bursts.push({
        obj: pts,
        pos,
        vel,
        born: introT,
        life: 0.55
      });
    }

    function applyResponsiveFit(){
      if(!logoGroup) return;

      // Choose a safe max punch based on orientation
      const aspect = innerWidth / innerHeight;
      maxPunch = (aspect < 1) ? PUNCH_PORTRAIT : PUNCH_LANDSCAPE;

      // Compute bounding box of the logo in its current scale
      const box = new THREE.Box3().setFromObject(logoGroup);
      const size = new THREE.Vector3();
      box.getSize(size);

      // Fit at the closest camera distance (startZ - maxPunch)
      const zClose = CAMERA_Z_START - maxPunch;
      const vFov = THREE.MathUtils.degToRad(camera.fov);
      const visibleH = 2 * zClose * Math.tan(vFov / 2);
      const visibleW = visibleH * camera.aspect;

      const pad = 0.86; // leave some breathing room
      const scaleX = (visibleW * pad) / Math.max(0.0001, size.x);
      const scaleY = (visibleH * pad) / Math.max(0.0001, size.y);
      const fitScale = Math.min(1, scaleX, scaleY);

      logoGroup.scale.setScalar(fitScale);
    }

    function centerLogoTrue(){
      // True centering using bounding box (after letters are in group)
      const box = new THREE.Box3().setFromObject(logoGroup);
      const center = new THREE.Vector3();
      box.getCenter(center);
      // shift group so its bounding-box center is at origin
      logoGroup.position.sub(center);
    }

    function replay(){
      introT = 0;

      for(const L of letters){
        L.obj.position.z = -110;
        L.obj.rotation.x = -0.9;
        L.obj.scale.set(1,1,1);
        L.sparked = false;
      }

      // clear bursts
      while(bursts.length){
        const b = bursts.pop();
        scene.remove(b.obj);
        b.obj.geometry.dispose();
        b.obj.material.dispose();
      }

      camera.position.z = CAMERA_Z_START;
    }

    addEventListener("keydown", (e) => {
      if(e.key === "r" || e.key === "R") replay();
    });

    // Font: keep the same one (safe)
    const fontUrl = "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/fonts/helvetiker_bold.typeface.json";
    const loader = new THREE.FontLoader();

    let maxPunch = PUNCH_LANDSCAPE;

    loader.load(
      fontUrl,
      (font) => {
        logoGroup = new THREE.Group();
        logoGroup.rotation.x = -0.20;
        logoGroup.rotation.y = 0.15; // hero tilt
        scene.add(logoGroup);

        const chars = TITLE.split("");
        let x = 0;

        // spacing tuned for this font size; centering will correct drift precisely
        const spacing = 5.2;

        for(let i=0;i<chars.length;i++){
          const ch = chars[i];
          if(ch === " "){ x += spacing * 0.7; continue; }

          const geo = new THREE.TextGeometry(ch, {
            font,
            size: 5,
            height: 1.7,
            curveSegments: 7,
            bevelEnabled: true,
            bevelThickness: 0.30,
            bevelSize: 0.26,
            bevelSegments: 4
          });

          geo.computeBoundingBox();
          geo.center();

          // Gradient face (still lit)
          const bb = geo.boundingBox;
          const faceMat = makeGradientStandardMaterial(bb.min.y, bb.max.y);
          const face = new THREE.Mesh(geo, faceMat);

          // Thick outline
          const outlineMat = new THREE.MeshStandardMaterial({
            color: OUTLINE_COLOR,
            metalness: 0.06,
            roughness: 0.98,
            side: THREE.BackSide
          });
          const outline = new THREE.Mesh(geo, outlineMat);
          outline.scale.set(1.14, 1.14, 1.14);
          outline.position.z = -0.42;

          // Subtle warm glow rim (very soft)
          const glowMat = new THREE.MeshBasicMaterial({
            color: GLOW_COLOR,
            transparent: true,
            opacity: 0.14,
            side: THREE.BackSide,
            blending: THREE.AdditiveBlending,
            depthWrite: false
          });
          const glow = new THREE.Mesh(geo, glowMat);
          glow.scale.set(1.22, 1.22, 1.22);
          glow.position.z = -0.72;

          const letter = new THREE.Group();
          letter.add(glow);
          letter.add(outline);
          letter.add(face);

          letter.position.set(x, 0, -110);
          letter.rotation.x = -0.9;

          logoGroup.add(letter);
          letters.push({ obj: letter, delay: i*0.11, sparked: false });

          x += spacing;
        }

        // True centering (fix #2)
        centerLogoTrue();

        // Responsive portrait fit (fix #1)
        applyResponsiveFit();

        // Hide loading overlay once built
        hud.style.display = "none";

        // Start loop
        tick();
      },
      undefined,
      (err) => {
        showErr("Font failed to load: " + (err && (err.message || err.toString()) || err));
      }
    );

    // --------------------------
    // Animation loop
    // --------------------------
    function tick(){
      requestAnimationFrame(tick);

      const dt = clock.getDelta();
      introT += dt;

      // Stars fly toward camera
      const a = starGeom.attributes.position.array;
      for(let i=0;i<a.length;i+=3){
        a[i+2] += 6.0;
        if(a[i+2] > 40) a[i+2] = -1300;
      }
      starGeom.attributes.position.needsUpdate = true;

      // Letter stagger punch-in + settle + idle float + spark impact
      for(let i=0;i<letters.length;i++){
        const L = letters[i];
        const t = introT - L.delay;

        if(t > 0){
          const p = Math.min(t*2.2, 1);

          L.obj.position.z = THREE.MathUtils.lerp(-110, 0, p);
          L.obj.rotation.x = THREE.MathUtils.lerp(-0.9, 0, p);

          // micro impact punch (keeps it arcade)
          const punch = (t < 0.36) ? (1 + Math.sin(t*18)*0.065) : 1;
          L.obj.scale.set(punch, punch, punch);

          // Spark when it "lands" (near completion)
          if(!L.sparked && p > 0.985){
            L.sparked = true;

            const wp = new THREE.Vector3();
            L.obj.getWorldPosition(wp);
            spawnSparkBurst(wp);
          }
        }

        // After landing: idle float
        if(t > 1.0){
          L.obj.position.y = Math.sin((introT + i*0.11)*2.3) * 0.35;
        }
      }

      // Update spark bursts
      for(let bi=bursts.length-1; bi>=0; bi--){
        const b = bursts[bi];
        const age = introT - b.born;
        const k = age / b.life;

        // fade out
        b.obj.material.opacity = Math.max(0, 0.95 * (1 - k));

        // integrate positions
        const arr = b.obj.geometry.attributes.position.array;
        for(let i=0;i<b.pos.length;i+=3){
          // basic gravity-ish drop
          b.vel[i+1] -= 0.09;

          arr[i+0] += b.vel[i+0];
          arr[i+1] += b.vel[i+1];
          arr[i+2] += b.vel[i+2];
        }
        b.obj.geometry.attributes.position.needsUpdate = true;

        if(age > b.life){
          scene.remove(b.obj);
          b.obj.geometry.dispose();
          b.obj.material.dispose();
          bursts.splice(bi, 1);
        }
      }

      // Camera punch-in (responsive max punch)
      camera.position.z = CAMERA_Z_START - Math.min(introT*10.5, maxPunch);

      renderer.render(scene, camera);
    }
  </script>
</body>
</html>
