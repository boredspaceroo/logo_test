<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Adventure Logo</title>

<style>
body{
margin:0;
overflow:hidden;
background:black;
}
</style>

</head>
<body>

<script type="module">

import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
import {FontLoader} from "https://unpkg.com/three@0.160.0/examples/jsm/loaders/FontLoader.js";
import {TextGeometry} from "https://unpkg.com/three@0.160.0/examples/jsm/geometries/TextGeometry.js";

const TITLE = "SPACE SLUGGERS";

let scene = new THREE.Scene();

let camera = new THREE.PerspectiveCamera(
60,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.z = 40;

let renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);

document.body.appendChild(renderer.domElement);

window.addEventListener("resize",()=>{

camera.aspect = window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);

});

const ambient = new THREE.AmbientLight(0xffffff,0.7);
scene.add(ambient);

const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,10);
scene.add(light);

const rim = new THREE.DirectionalLight(0xff6600,1);
rim.position.set(-6,-3,6);
scene.add(rim);

let clock = new THREE.Clock();
let letters = [];



/* STARFIELD */

const starGeometry = new THREE.BufferGeometry();
const starCount = 1500;

let positions = [];

for(let i=0;i<starCount;i++){

positions.push(
(Math.random()-0.5)*400,
(Math.random()-0.5)*400,
Math.random()*-600
);

}

starGeometry.setAttribute(
"position",
new THREE.Float32BufferAttribute(positions,3)
);

const starMaterial = new THREE.PointsMaterial({
color:0xffffff,
size:0.8
});

const stars = new THREE.Points(starGeometry,starMaterial);
scene.add(stars);



/* LOAD FONT + CREATE TEXT */

const loader = new FontLoader();

loader.load(
"https://threejs.org/examples/fonts/helvetiker_bold.typeface.json",
(font)=>{

let offset = 0;

TITLE.split("").forEach((char,i)=>{

if(char===" "){
offset+=4;
return;
}

const geo = new TextGeometry(char,{
font:font,
size:4,
height:1.2,
bevelEnabled:true,
bevelThickness:0.2,
bevelSize:0.2,
bevelSegments:3
});

geo.center();

const material = new THREE.MeshStandardMaterial({
color:0xff7a00,
metalness:0.4,
roughness:0.3
});

const mesh = new THREE.Mesh(geo,material);

mesh.position.x = offset;
mesh.position.z = -80;
mesh.rotation.x = -0.7;

scene.add(mesh);

letters.push({
mesh:mesh,
delay:i*0.15,
startZ:-80
});

offset+=5;

});

offset = offset/2;

letters.forEach(l=>{
l.mesh.position.x -= offset;
});

}
);



let introTime = 0;

function animate(){

requestAnimationFrame(animate);

let delta = clock.getDelta();

introTime += delta;


/* star movement */

stars.geometry.attributes.position.array.forEach((v,i,a)=>{

if(i%3===2){
a[i]+=2;

if(a[i]>10){
a[i]=-600;
}
}

});

stars.geometry.attributes.position.needsUpdate=true;


/* letters animation */

letters.forEach(letter=>{

let t = introTime - letter.delay;

if(t>0){

let progress = Math.min(t*2,1);

letter.mesh.position.z =
THREE.MathUtils.lerp(letter.startZ,0,progress);

letter.mesh.rotation.x =
THREE.MathUtils.lerp(-0.7,0,progress);

}

if(t>1){

letter.mesh.position.y =
Math.sin((introTime+letter.delay)*2)*0.2;

}

});


/* camera punch-in */

camera.position.z =
40 - Math.min(introTime*10,10);

renderer.render(scene,camera);

}

animate();



/* replay animation */

document.addEventListener("keydown",(e)=>{

if(e.key==="r" || e.key==="R"){

letters.forEach(l=>{
l.mesh.position.z = l.startZ;
});

introTime = 0;

}

});

</script>

</body>
</html>
